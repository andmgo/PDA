spring.application.name=gescazone-api
server.port=${SERVER_PORT:8080}

# Perfil activo por defecto: "dev" habilita DataInitializer (datos semilla).
# En Azure/producción, definir SPRING_PROFILES_ACTIVE=prod para desactivarlo.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# CONFIGURACIÓN DE BASE DE DATOS PostgreSQL
# Valores reales fuera del repo: variables de entorno DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gescazone}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo gobierna Flyway (ver src/main/resources/db/migration), no Hibernate.
# "validate" evita que la app arranque si el esquema real no coincide con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# CONFIGURACIÓN GENERAL
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS — orígenes permitidos, centralizado en SecurityConfig. Separados por
# coma. gescazone-web corre en el puerto 8081 en local.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081}

# JWT (expiration en milisegundos: 86400000 = 24 horas)
# El valor real vive fuera del repo. En local: variable de entorno JWT_SECRET.
# El valor por defecto de abajo es SOLO para arrancar en desarrollo y no debe
# usarse nunca en producción.
jwt.secret=${JWT_SECRET:dev-only-secret-cambia-esto-antes-de-produccion}
jwt.expiration=86400000

# Clave interna compartida SOLO con gescazone-web, para endpoints sin
# contraseña que confían en que web ya verificó la identidad por otro medio
# (hoy: POST /api/auth/login-google, tras verificación con Google OIDC).
# El valor por defecto de abajo es SOLO para desarrollo local.
internal.api-key=${INTERNAL_API_KEY:dev-only-internal-key-cambia-esto-antes-de-produccion}

# Envío de correo (SMTP de Gmail) — hoy solo lo usa el reseteo de
# contraseña por un administrador (MailService). Sin MAIL_USERNAME/
# MAIL_PASSWORD configurados la app arranca igual (mismo criterio que
# JWT_SECRET/GOOGLE_CLIENT_ID), pero el envío falla en tiempo de
# ejecución con un error claro — ver MailService.
# MAIL_PASSWORD es una "contraseña de aplicación" de Google, no la
# contraseña real de la cuenta de Gmail.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
