spring.application.name=gescazone-web
server.port=${SERVER_PORT:8081}

# Configuración de archivos estáticos
spring.web.resources.static-locations=classpath:/static/

# Configuración de Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# URL base de gescazone-api — Web nunca toca la base de datos, todo pasa por aquí.
api.base-url=${API_BASE_URL:http://localhost:8080}

# Clave interna compartida SOLO con gescazone-api (mismo valor que
# internal.api-key allá) — la manda AuthApiClient.loginGoogle() para probar
# que la petición viene de este servidor, no de un navegador cualquiera.
internal.api-key=${INTERNAL_API_KEY:dev-only-internal-key-cambia-esto-antes-de-produccion}

# TIEMPO DE VIDA DE LA SESIÓN (30 minutos) — aquí sí hay sesión HTTP: guarda
# el JWT emitido por la Api (ver SesionUsuario), no las credenciales.
server.servlet.session.timeout=30m

# Cookie de sesión
server.servlet.session.cookie.name=GESCAZONE-SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=1800
# Lax es necesario para que la cookie se envíe en el redirect cross-site
# que hace Google al devolver el control a /login/oauth2/code/google.
server.servlet.session.cookie.same-site=lax

# ══════════════════════════════════════════════════════════════════
#  OAUTH2 - Google
#
#  PROPÓSITO: verificación de identidad para acciones internas (pagos,
#  reservas). NO se usa para iniciar sesión en el sistema — eso es
#  /login contra gescazone-api (ver ApiAuthenticationProvider).
#
#  El redirect URI debe estar registrado en Google Cloud Console:
#    http://localhost:8081/login/oauth2/code/google
# ══════════════════════════════════════════════════════════════════
# Valores reales fuera del repo: variables de entorno GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:TU_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:TU_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
