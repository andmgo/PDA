<!DOCTYPE html>
<html lang="es">
  <head>
    <script>(function(){try{var t=localStorage.getItem('gescazone_tema');if(t==='oscuro'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/aurum-apple-touch.png}" />
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/img/aurum-favicon.png}" />
    <title>Aurum Condominios - Control de accesos</title>
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/nucleo-icons.css}" rel="stylesheet" />
    <link th:href="@{/css/nucleo-svg.css}" rel="stylesheet" />
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <link th:href="@{/css/argon-dashboard-tailwind.css}" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link th:href="@{/css/gescazone-theme.css}" rel="stylesheet" />
    <link th:href="@{/css/aurum-ui.css}" rel="stylesheet" />
  </head>

<body class="m-0 font-sans text-base antialiased font-normal dark:bg-slate-900 leading-default bg-gray-50 text-slate-500">
  <div th:replace="~{fragments/sidebar :: sidebar(activo='accesos')}"></div>

  <main class="relative h-full max-h-screen transition-all duration-200 ease-in-out xl:ml-68 rounded-xl">
    <div th:replace="~{fragments/topbar :: topbar(titulo='Control de accesos', seccion='Portería', descripcion='Registra la entrada y salida de visitantes y el acceso a la piscina.')}"></div>

    <div class="w-full px-6 py-6 mx-auto">
      <div class="gsz-acc-grid">

        <!-- ── Ingreso en un solo paso ── -->
        <section class="gsz-panel gsz-acc-form">
          <p class="gsz-kicker">Ingreso de visitantes</p>
          <h2 class="gsz-card-titulo">¿Quién llega?</h2>
          <p class="gsz-card-sub">Escribe el documento: si ya vino antes, sus datos se completan solos.</p>

          <form id="ingresoForm" class="gsz-form-stack" onsubmit="return registrarIngreso(event)" autocomplete="off">
            <div id="ingresoAviso" class="gsz-aviso" role="status"></div>

            <label class="gsz-campo">
              <span>Documento</span>
              <input type="text" id="docVisitante" inputmode="numeric" maxlength="12" required class="gsz-mono gsz-input-grande" placeholder="Número de documento" />
            </label>
            <p id="visitanteEstado" class="gsz-visitante-estado"></p>

            <div class="gsz-campos-2">
              <label class="gsz-campo"><span>Nombre</span><input type="text" id="nombreVisitante" maxlength="100" placeholder="Nombre" /></label>
              <label class="gsz-campo"><span>Apellido</span><input type="text" id="apellidoVisitante" maxlength="100" placeholder="Apellido" /></label>
            </div>

            <div class="gsz-campos-2">
              <label class="gsz-campo"><span>Apartamento</span><input type="text" id="aptoVisitante" maxlength="10" required placeholder="Ej: 301" /></label>
              <label class="gsz-campo"><span>Celular <em>(opcional)</em></span><input type="text" id="celularVisitante" inputmode="tel" maxlength="15" placeholder="300 000 0000" /></label>
            </div>
            <p id="habitantesInfo" class="gsz-habitantes" aria-live="polite"></p>
            <label class="gsz-campo">
              <span>¿Quién autorizó el ingreso?</span>
              <input type="text" id="autorizadoPor" list="habitantesApto" maxlength="150" required autocomplete="off"
                     placeholder="Residente que dio el paso" />
              <datalist id="habitantesApto"></datalist>
            </label>

            <div class="gsz-campo">
              <span>¿Cómo llega?</span>
              <div class="gsz-segmentado gsz-segmentado-bloque" role="radiogroup">
                <button type="button" class="activo" data-modo="pie" onclick="elegirModo(this)">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M10 21l1.5-6.5L9 12V8.5l3-1 3 2.5 2.5 1M11.5 14.5 14 17v4"/></svg>A pie
                </button>
                <button type="button" data-modo="vehiculo" onclick="elegirModo(this)">
                  <svg viewBox="0 0 24 24"><path d="M4 16v-4l2-4h12l2 4v4"/><path d="M4 16h16v2.5a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1V17h-9v1.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>En vehículo
                </button>
              </div>
            </div>

            <div id="camposVehiculo" class="gsz-campos-2" hidden>
              <label class="gsz-campo"><span>Placa</span><input type="text" id="placaVisitante" maxlength="8" placeholder="ABC123" class="gsz-mono gsz-input-placa" /></label>
              <label class="gsz-campo"><span>Parqueadero</span>
                <select id="parqueaderoVisitante"><option value="">Asignar automáticamente</option></select>
              </label>
            </div>

            <button type="submit" class="gsz-btn gsz-btn-noche gsz-btn-bloque" id="btnIngreso">
              <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>Registrar ingreso
            </button>
          </form>
        </section>

        <!-- ── Quién está dentro / historial / piscina ── -->
        <section class="gsz-panel">
          <div class="gsz-panel-head">
            <div>
              <p class="gsz-kicker" id="vistaKicker">En este momento</p>
              <h2 class="gsz-card-titulo" id="vistaTitulo">Dentro del conjunto <span id="contadorVista" class="gsz-contador"></span></h2>
            </div>
            <div class="gsz-segmentado" role="tablist">
              <button type="button" class="activo" data-vista="dentro" onclick="cambiarVista(this)">Dentro ahora</button>
              <button type="button" data-vista="esperados" onclick="cambiarVista(this)">Esperados <span id="contadorEsperados" class="gsz-contador gsz-contador-mini"></span></button>
              <button type="button" data-vista="hoy" onclick="cambiarVista(this)">Hoy</button>
              <button type="button" data-vista="piscina" onclick="cambiarVista(this)">Piscina</button>
            </div>
          </div>

          <div id="vistaVisitas">
            <ul id="listaVisitas" class="gsz-visitas"></ul>
          </div>

          <!-- Piscina -->
          <div id="vistaPiscina" hidden>
            <div id="piscinaAviso" class="gsz-aviso" role="status"></div>
            <form class="gsz-piscina-form" onsubmit="return registrarPiscina(event)">
              <label class="gsz-campo"><span>Documento del residente</span><input type="text" id="documentoPiscina" inputmode="numeric" maxlength="12" required class="gsz-mono" placeholder="Documento" /></label>
              <label class="gsz-campo"><span>Apartamento</span><input type="text" id="apartamentoPiscina" maxlength="10" required placeholder="Ej: 301" /></label>
              <button type="submit" class="gsz-btn gsz-btn-noche">Registrar acceso</button>
            </form>
            <div class="overflow-x-auto">
              <table class="items-center w-full mb-0 align-top border-collapse">
                <thead class="align-bottom">
                  <tr>
                    <th class="px-4 py-3 text-left">Residente</th>
                    <th class="px-4 py-3 text-left">Apto</th>
                    <th class="px-4 py-3 text-left">Fecha y hora</th>
                    <th class="px-4 py-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody id="historialPiscinaBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Modal Modificar Acceso Piscina -->
  <div id="modificarPiscinaModal" class="modal">
    <div class="modal-content">
      <h5 class="text-lg font-bold mb-4">Modificar acceso a piscina</h5>
      <form id="modificarPiscinaForm" class="gsz-form-stack" onsubmit="return guardarPiscina(event)">
        <div id="modificarPiscinaAviso" class="gsz-aviso" role="status"></div>
        <input type="hidden" id="idAccesoModificar" />
        <label class="gsz-campo"><span>Documento del residente</span><input type="text" id="documentoPiscinaModificar" required maxlength="12" class="gsz-mono" /></label>
        <label class="gsz-campo"><span>Apartamento</span><input type="text" id="apartamentoPiscinaModificar" required maxlength="10" /></label>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="cerrarModificarPiscina()" class="gsz-btn gsz-btn-borde">Cancelar</button>
          <button type="submit" class="gsz-btn gsz-btn-noche">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script th:src="@{/js/controlDeAccesos.js}"></script>
</body>
</html>
