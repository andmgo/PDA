<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  Encabezado de página, mismo lenguaje que el hero de la landing: bloque azul
  noche con rótulo dorado (sección), título y una línea de descripción.
  Uso: th:replace="~{fragments/topbar :: topbar(titulo='Paquetes', seccion='Portería',
        descripcion='...')}"
  No se usa en inicio.html (tiene su propio saludo con el mismo estilo).
*/-->
<header th:fragment="topbar(titulo, seccion, descripcion)" class="gsz-page-hero">
  <div class="gsz-page-hero-texto">
    <p class="gsz-page-hero-kicker" th:text="${seccion}">Sección</p>
    <h1 th:text="${titulo}">Página</h1>
    <p class="gsz-page-hero-desc" th:if="${descripcion}" th:text="${descripcion}">Descripción</p>
  </div>
  <button type="button" class="gsz-page-hero-menu" sidenav-trigger aria-label="Abrir menú">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>

</body>
</html>
