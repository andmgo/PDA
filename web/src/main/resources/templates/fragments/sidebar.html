<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  Sidebar único, incluido con th:replace="~{fragments/sidebar :: sidebar(activo='inicio')}"
  (valores de activo: inicio, visitas, misPaquetes, accesos, paquetes, reservas, pagos, gestion, roles, perfil).
  Antes esta barra estaba duplicada, casi idéntica, en 8 plantillas — Bloque G la unificó
  aquí para poder cambiar navegación/íconos en un solo lugar.
*/-->
<aside th:fragment="sidebar(activo)"
       class="fixed inset-y-0 flex-wrap items-center justify-between block w-full p-0 my-4 overflow-y-auto antialiased transition-transform duration-200 -translate-x-full bg-white border-0 shadow-xl dark:shadow-none dark:bg-slate-850 xl:ml-6 max-w-64 ease-nav-brand z-990 rounded-2xl xl:left-0 xl:translate-x-0" aria-expanded="false">
  <!-- Va primero a propósito: aplica el estado colapsado guardado ANTES de
       que el navegador pinte la barra y el <main> (evita el "salto"). -->
  <script>try{if(localStorage.getItem('aurum_sidebar')==='colapsado')document.documentElement.classList.add('gsz-colapsado');}catch(e){}</script>
  <div class="gsz-sidebar-header">
    <div class="flex items-center justify-between px-6 py-6 m-0 text-sm">
      <a th:href="@{/inicio}" class="flex items-center min-w-0" title="Aurum Condominios">
        <img th:src="@{/img/aurum-isotipo.png}" class="gsz-isotipo shrink-0" alt="Aurum Condominios" />
        <span class="gsz-brand-text ml-2 leading-tight"><img th:src="@{/img/aurum-palabra.png}" alt="Aurum" class="aurum-palabra" /><small>Condominios</small></span>
      </a>
      <div class="gsz-sidebar-actions">
        <button type="button" class="gsz-theme-toggle shrink-0" onclick="gszToggleTema()" title="Cambiar tema" aria-label="Cambiar tema claro/oscuro">
          <svg class="gsz-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          <svg class="gsz-icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        </button>
        <button type="button" class="gsz-collapse-btn" onclick="gszAlternarColapso()" title="Contraer / expandir menú" aria-label="Contraer o expandir el menú lateral">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15"/><path d="M15.5 10 13.5 12l2 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <hr class="h-px mt-0 bg-transparent bg-gradient-to-r from-transparent via-black/40 to-transparent dark:bg-gradient-to-r dark:from-transparent dark:via-white dark:to-transparent" />

  <div class="items-center block w-auto max-h-screen overflow-auto h-sidenav grow basis-full">
    <!--/* Menú por secciones. Cada opción depende del PERMISO del rol (Roles y
         permisos), igual que la regla de su ruta en SecurityConfig, así un
         rol nuevo ve exactamente lo que puede abrir. Una sección solo aparece
         si el usuario ve alguna de sus opciones. Orden: lo del día a día de
         cada rol primero (Mi hogar / Portería), luego Comunidad,
         Administración y Cuenta. */-->
    <ul class="flex flex-col pl-0 mb-0"
        th:with="pVisitas=${@sesionUsuario.tienePermiso('VISITAS', false)},
                 pMisPaquetes=${@sesionUsuario.tienePermiso('MIS_PAQUETES', false)},
                 pAccesos=${@sesionUsuario.tienePermiso('CONTROL_ACCESOS', false)},
                 pPaquetes=${@sesionUsuario.tienePermiso('PAQUETES', false)},
                 pReservas=${@sesionUsuario.tienePermiso('RESERVAS', false)},
                 pPagos=${@sesionUsuario.tienePermiso('PAGOS_Y_CARTERA', false)},
                 pGestion=${@sesionUsuario.tienePermiso('GESTION_DATOS', false)},
                 pRoles=${@sesionUsuario.tienePermiso('GESTION_DATOS', true)}">

      <li class="mt-0.5 w-full">
        <a th:href="@{/inicio}"
           th:class="${activo == 'inicio'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-blue"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Inicio</span>
        </a>
      </li>

      <li class="gsz-nav-section w-full mt-4" th:if="${pVisitas or pMisPaquetes}">
        <h6 class="pl-6 ml-2 text-xs font-bold leading-tight uppercase dark:text-white opacity-60">Mi hogar</h6>
      </li>
      <li class="mt-0.5 w-full" th:if="${pVisitas}">
        <a th:href="@{/misVisitas}"
           th:class="${activo == 'visitas'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-green"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.7-3.2 2.8-5 5.5-5 1.3 0 2.5.4 3.4 1.1"/><path d="M15 17.5l2 2 4-4.5"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Mis visitas</span>
        </a>
      </li>
      <li class="mt-0.5 w-full" th:if="${pMisPaquetes}">
        <a th:href="@{/misPaquetes}"
           th:class="${activo == 'misPaquetes'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-green"><svg viewBox="0 0 24 24"><path d="M3.5 8 12 4l8.5 4-8.5 4-8.5-4z"/><path d="M3.5 8v8l8.5 4 8.5-4V8"/><path d="M12 12v8"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Mis paquetes</span>
        </a>
      </li>

      <li class="gsz-nav-section w-full mt-4" th:if="${pAccesos or pPaquetes}">
        <h6 class="pl-6 ml-2 text-xs font-bold leading-tight uppercase dark:text-white opacity-60">Portería</h6>
      </li>
      <li class="mt-0.5 w-full" th:if="${pAccesos}">
        <a th:href="@{/controlDeAccesos}"
           th:class="${activo == 'accesos'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-red"><svg viewBox="0 0 24 24"><path d="M12 3.5 19 6v6c0 5-3 8-7 8.5-4-.5-7-3.5-7-8.5V6z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Control de accesos</span>
        </a>
      </li>
      <li class="mt-0.5 w-full" th:if="${pPaquetes}">
        <a th:href="@{/paquetes}"
           th:class="${activo == 'paquetes'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-amber"><svg viewBox="0 0 24 24"><path d="M3.5 9 12 5l8.5 4v8l-8.5 4-8.5-4z"/><path d="M12 13v8"/><path d="M3.5 9 12 13l8.5-4"/><path d="M12 1.5v5"/><path d="M10 4.5l2 2 2-2"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Recepción de paquetes</span>
        </a>
      </li>

      <li class="gsz-nav-section w-full mt-4" th:if="${pReservas or pPagos}">
        <h6 class="pl-6 ml-2 text-xs font-bold leading-tight uppercase dark:text-white opacity-60">Comunidad</h6>
      </li>
      <li class="mt-0.5 w-full" th:if="${pReservas}">
        <a th:href="@{/reservas}"
           th:class="${activo == 'reservas'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-cyan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/><path d="M8.5 14l2 2 4-4"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Reservas</span>
        </a>
      </li>
      <li class="mt-0.5 w-full" th:if="${pPagos}">
        <a th:href="@{/pagosYCartera}"
           th:class="${activo == 'pagos'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-green"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="17" cy="14" r="1.4" fill="currentColor" stroke="none"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Pagos y cartera</span>
        </a>
      </li>

      <li class="gsz-nav-section w-full mt-4" th:if="${pGestion or pRoles}">
        <h6 class="pl-6 ml-2 text-xs font-bold leading-tight uppercase dark:text-white opacity-60">Administración</h6>
      </li>
      <li class="mt-0.5 w-full" th:if="${pGestion}">
        <a th:href="@{/gestionDeDatos}"
           th:class="${activo == 'gestion'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-violet"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Gestión de datos</span>
        </a>
      </li>
      <li class="mt-0.5 w-full" th:if="${pRoles}">
        <a th:href="@{/rolesYPermisos}"
           th:class="${activo == 'roles'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-red"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 19 4"/><path d="M16 7l2.5 2.5"/><path d="M14 9l2 2"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Roles y permisos</span>
        </a>
      </li>

      <li class="gsz-nav-section w-full mt-4">
        <h6 class="pl-6 ml-2 text-xs font-bold leading-tight uppercase dark:text-white opacity-60">Cuenta</h6>
      </li>
      <li class="mt-0.5 w-full">
        <a th:href="@{/profile}"
           th:class="${activo == 'perfil'}
               ? 'py-2.7 bg-blue-500/13 dark:text-white dark:opacity-80 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap rounded-lg px-4 font-semibold text-slate-700 transition-colors'
               : 'py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors dark:text-white dark:opacity-80'">
          <span class="gsz-icon-badge gsz-badge-neutral"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.3"/><path d="M5 20c1-3.8 4-5.8 7-5.8s6 2 7 5.8"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Mi perfil</span>
        </a>
      </li>

      <!-- CERRAR SESIÓN - TODOS -->
      <li class="mt-0.5 w-full">
        <a th:href="@{/logout}"
            onclick="return confirmarCerrarSesion(event)"
            class="dark:text-white dark:opacity-80 py-2.7 text-sm ease-nav-brand my-0 mx-2 flex items-center whitespace-nowrap px-4 transition-colors hover:bg-red-50">
          <span class="gsz-icon-badge gsz-badge-neutral"><svg viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg></span>
          <span class="gsz-nav-label ml-1 duration-300 opacity-100 pointer-events-none ease">Cerrar sesión</span>
        </a>
      </li>
    </ul>
  </div>

  <script>
    // Mantener la sesión mientras la persona esté usando la página: si hubo
    // actividad (mouse, teclado, toque, desplazamiento) en los últimos 4
    // minutos, se avisa al servidor; así un formulario largo no vence. Un
    // equipo olvidado sin uso sí se cierra solo a los 30 min (portería
    // comparte computador). Ver server.servlet.session.timeout.
    (function () {
      var ultimaActividad = Date.now();
      ["mousemove", "keydown", "touchstart", "scroll", "click"].forEach(function (ev) {
        window.addEventListener(ev, function () { ultimaActividad = Date.now(); }, { passive: true });
      });
      setInterval(function () {
        if (Date.now() - ultimaActividad < 4 * 60 * 1000) {
          fetch("/api/auth/estado", { credentials: "same-origin" }).then(function (r) {
            if (r.status === 401 || r.redirected) window.location.href = "/login?error=session_expired";
          }).catch(function () { /* sin conexión: se reintenta en el próximo ciclo */ });
        }
      }, 4 * 60 * 1000);
    })();

    function gszToggleTema() {
      var esOscuro = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('gescazone_tema', esOscuro ? 'oscuro' : 'claro'); } catch (e) { /* almacenamiento no disponible */ }
    }

    // Contraer/expandir la barra en escritorio (≥1280px) — queda solo la
    // columna de íconos. La preferencia se recuerda entre páginas.
    function gszAlternarColapso() {
      var colapsado = document.documentElement.classList.toggle('gsz-colapsado');
      try { localStorage.setItem('aurum_sidebar', colapsado ? 'colapsado' : 'expandido'); } catch (e) { /* almacenamiento no disponible */ }
    }

    // Con la barra contraída solo se ven los íconos: el nombre de cada
    // opción queda como tooltip nativo.
    document.querySelectorAll('aside[aria-expanded] li > a').forEach(function (a) {
      var etiqueta = a.querySelector('.gsz-nav-label');
      if (etiqueta && !a.title) a.title = etiqueta.textContent.trim();
    });

    // Botón de menú (☰) en pantallas angostas — antes apuntaba a
    // argon-dashboard-tailwind.js, que no existe en el proyecto (nunca
    // existió), así que el botón no hacía nada y el sidebar quedaba
    // inalcanzable por debajo de xl (1280px). El backdrop se crea/quita
    // por JS en vez de vivir en el HTML porque el sidebar es un fragmento
    // que se incluye igual en las 8 plantillas — así no hace falta tocar
    // ninguna para agregarlo.
    (function () {
      var backdrop = null;

      function alternarSidebar(forzarAbierto) {
        var aside = document.querySelector('aside[aria-expanded]');
        if (!aside) return;
        var abierto = typeof forzarAbierto === 'boolean' ? forzarAbierto : !aside.classList.contains('gsz-sidebar-open');

        aside.classList.toggle('gsz-sidebar-open', abierto);
        aside.setAttribute('aria-expanded', abierto ? 'true' : 'false');

        if (abierto && !backdrop) {
          backdrop = document.createElement('div');
          backdrop.className = 'gsz-sidebar-backdrop';
          document.body.appendChild(backdrop);
        } else if (!abierto && backdrop) {
          backdrop.remove();
          backdrop = null;
        }
      }

      document.addEventListener('click', function (e) {
        if (e.target.closest('[sidenav-trigger]')) {
          e.preventDefault();
          alternarSidebar();
          return;
        }
        if (e.target.classList && e.target.classList.contains('gsz-sidebar-backdrop')) {
          alternarSidebar(false);
        }
      });
    })();
  </script>
</aside>

</body>
</html>
