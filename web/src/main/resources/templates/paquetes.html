<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <script>(function(){try{var t=localStorage.getItem('gescazone_tema');if(t==='oscuro'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: instalable como aplicación (manifest + service worker, ver static/sw.js) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E2A4A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurum" />
    <script src="/js/pwa.js" defer></script>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/aurum-apple-touch.png}" />
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/img/aurum-favicon.png}" />
    <title>Aurum Condominios - Recepción de paquetes</title>
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/nucleo-icons.css}" rel="stylesheet" />
    <link th:href="@{/css/nucleo-svg.css}" rel="stylesheet" />
    <link th:href="@{/css/argon-dashboard-tailwind.css}" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link th:href="@{/css/gescazone-theme.css}" rel="stylesheet" />
    <link th:href="@{/css/aurum-ui.css}" rel="stylesheet" />
</head>

<body class="m-0 font-sans text-base antialiased font-normal dark:bg-slate-900 leading-default bg-gray-50 text-slate-500">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activo='paquetes')}"></div>

    <!-- Main Content -->
    <main class="relative h-full max-h-screen transition-all duration-200 ease-in-out xl:ml-68 rounded-xl">
        <div th:replace="~{fragments/topbar :: topbar(titulo='Recepción de paquetes', seccion='Portería', descripcion='Registra los paquetes que llegan y su entrega a cada apartamento.')}"></div>

        <div class="w-full px-6 py-6 mx-auto">
            <div class="gsz-paq-grid">

                <!-- Registrar -->
                <section class="gsz-panel gsz-paq-form">
                    <p class="gsz-kicker">Recepción</p>
                    <h2 class="gsz-card-titulo">Nuevo paquete</h2>
                    <p class="gsz-card-sub">Registra el paquete apenas llega a portería.</p>

                    <form id="paqueteForm" onsubmit="return submitPaquete(event)" class="gsz-form-stack">
                        <div id="paqueteAviso" class="gsz-aviso" role="status"></div>
                        <label class="gsz-campo">
                            <span>Apartamento</span>
                            <input type="text" id="numeroApartamentoPaquete" required maxlength="10" placeholder="Ej: 301" autocomplete="off" />
                        </label>
                        <label class="gsz-campo">
                            <span>Nombre de quien recibe</span>
                            <input type="text" id="nombreReceptor" required maxlength="150" placeholder="Ej: Juan Pérez" />
                        </label>
                        <label class="gsz-campo">
                            <span>Cédula de quien recibe</span>
                            <input type="text" id="cedulaReceptor" required maxlength="15" placeholder="Ej: 1234567890" class="gsz-mono" />
                        </label>
                        <label class="gsz-campo">
                            <span>Descripción <em>(opcional)</em></span>
                            <input type="text" id="descripcionPaquete" maxlength="150" placeholder="Ej: Caja de Amazon, sobre" />
                        </label>
                        <button type="submit" class="gsz-btn gsz-btn-noche gsz-btn-bloque">
                            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Registrar paquete
                        </button>
                    </form>
                </section>

                <!-- Lista -->
                <section class="gsz-panel">
                    <div class="gsz-panel-head">
                        <div>
                            <p class="gsz-kicker">Historial</p>
                            <h2 class="gsz-card-titulo">Paquetes <span id="paquetesContador" class="gsz-contador"></span></h2>
                        </div>
                        <div class="gsz-segmentado" role="tablist" aria-label="Filtrar paquetes">
                            <button type="button" class="activo" data-filtro="pendientes" onclick="filtrarPaquetes(this)">Pendientes</button>
                            <button type="button" data-filtro="todos" onclick="filtrarPaquetes(this)">Todos</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="items-center w-full mb-0 align-top border-collapse">
                            <thead class="align-bottom">
                                <tr>
                                    <th class="px-4 py-3 text-left">Apto</th>
                                    <th class="px-4 py-3 text-left">Recibe</th>
                                    <th class="px-4 py-3 text-left">Llegada</th>
                                    <th class="px-4 py-3 text-center">Estado</th>
                                    <th class="px-4 py-3 text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="paquetesTableBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script th:src="@{/js/paquetes.js}"></script>
</body>
</html>
