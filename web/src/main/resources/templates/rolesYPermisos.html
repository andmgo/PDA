<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <script>(function(){try{var t=localStorage.getItem('gescazone_tema');if(t==='oscuro'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="76x76" th:href="@{/img/apple-icon.png}" />
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}" />
    <title>Aurum Condominios - Roles y Permisos</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/nucleo-icons.css}" rel="stylesheet" />
    <link th:href="@{/css/nucleo-svg.css}" rel="stylesheet" />
    <link th:href="@{/css/argon-dashboard-tailwind.css}" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link th:href="@{/css/gescazone-theme.css}" rel="stylesheet" />
</head>

<body class="m-0 font-sans text-base antialiased font-normal dark:bg-slate-900 leading-default bg-gray-50 text-slate-500">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(activo='roles')}"></div>

    <main class="relative h-full max-h-screen transition-all duration-200 ease-in-out xl:ml-68 rounded-xl">
        <div th:replace="~{fragments/topbar :: topbar(titulo='Roles y Permisos')}"></div>

        <div class="w-full px-6 py-6 mx-auto">
            <div class="flex flex-wrap -mx-3 mb-6">
                <div class="flex-none w-full max-w-full px-3">
                    <div class="relative flex flex-col min-w-0 break-words bg-white border-0 border-transparent border-solid shadow-xl dark:bg-slate-850 dark:shadow-dark-xl rounded-2xl bg-clip-border">
                        <div class="p-6">

                            <!-- Crear rol nuevo -->
                            <div class="flex flex-wrap items-end gap-3 mb-6 pb-6 border-b border-gray-200">
                                <div class="flex flex-col flex-1 min-w-[220px]">
                                    <label class="block text-sm font-semibold mb-1 text-slate-600">Nombre del rol nuevo</label>
                                    <input id="nombreRolNuevo" type="text" placeholder="Ej. VIGILANTE"
                                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none" />
                                </div>
                                <button onclick="crearRol()"
                                        class="px-4 py-2 text-sm font-semibold text-white bg-blue-500 rounded-lg hover:bg-blue-600 transition-colors">
                                    <i class="fas fa-plus mr-1"></i>Crear rol
                                </button>
                            </div>

                            <p class="text-sm text-slate-500 mb-4">
                                Un rol nuevo arranca sin ningún permiso marcado. Marca las casillas y guarda cada cambio con el botón de su fila.
                            </p>

                            <div id="mensajeEstado" class="hidden mb-4 px-4 py-2 rounded-lg text-sm"></div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead>
                                        <tr class="border-b border-gray-200 text-left text-slate-600">
                                            <th class="py-2 pr-4">Rol</th>
                                            <th class="py-2 pr-4">Permiso</th>
                                            <th class="py-2 pr-4 text-center">Ver</th>
                                            <th class="py-2 pr-4 text-center">Editar</th>
                                            <th class="py-2 pr-4"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="cuerpoMatriz"></tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        async function cargarMatriz() {
            const resp = await fetch('/api/roles-permisos/matriz');
            if (!resp.ok) {
                mostrarMensaje('No se pudo cargar la matriz de permisos.', true);
                return;
            }
            const datos = await resp.json();
            renderizarMatriz(datos.roles, datos.permisos, datos.celdas);
        }

        function renderizarMatriz(roles, permisos, celdas) {
            const cuerpo = document.getElementById('cuerpoMatriz');
            cuerpo.innerHTML = '';

            roles.forEach(nombreRol => {
                permisos.forEach(permiso => {
                    const celda = celdas.find(c => c.nombreRol === nombreRol && c.codigoPermiso === permiso.codigo);
                    const puedeVer = celda ? celda.puedeVer : false;
                    const puedeEditar = celda ? celda.puedeEditar : false;

                    const fila = document.createElement('tr');
                    fila.className = 'border-b border-gray-100';
                    fila.innerHTML = `
                        <td class="py-2 pr-4 font-semibold">${nombreRol}</td>
                        <td class="py-2 pr-4">${permiso.nombre}</td>
                        <td class="py-2 pr-4 text-center"><input type="checkbox" class="chk-ver" ${puedeVer ? 'checked' : ''}></td>
                        <td class="py-2 pr-4 text-center"><input type="checkbox" class="chk-editar" ${puedeEditar ? 'checked' : ''}></td>
                        <td class="py-2 pr-4">
                            <button class="px-3 py-1 text-xs font-semibold text-white bg-emerald-500 rounded-lg hover:bg-emerald-600 transition-colors">
                                Guardar
                            </button>
                        </td>
                    `;

                    const chkVer = fila.querySelector('.chk-ver');
                    const chkEditar = fila.querySelector('.chk-editar');
                    const btnGuardar = fila.querySelector('button');
                    btnGuardar.addEventListener('click', () => guardarCelda(nombreRol, permiso.codigo, chkVer.checked, chkEditar.checked));

                    cuerpo.appendChild(fila);
                });
            });
        }

        async function guardarCelda(nombreRol, codigoPermiso, puedeVer, puedeEditar) {
            const resp = await fetch('/api/roles-permisos/celda', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombreRol, codigoPermiso, puedeVer, puedeEditar })
            });
            if (resp.ok) {
                mostrarMensaje(`Permiso de "${nombreRol}" sobre "${codigoPermiso}" actualizado.`, false);
            } else {
                const texto = await resp.text();
                mostrarMensaje(texto || 'No se pudo guardar el permiso.', true);
            }
        }

        async function crearRol() {
            const nombreRol = document.getElementById('nombreRolNuevo').value.trim();
            if (!nombreRol) {
                mostrarMensaje('Escribe un nombre de rol.', true);
                return;
            }
            const resp = await fetch('/api/roles-permisos/roles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombreRol })
            });
            if (resp.ok) {
                document.getElementById('nombreRolNuevo').value = '';
                mostrarMensaje(`Rol "${nombreRol}" creado. Márcale sus permisos abajo.`, false);
                cargarMatriz();
            } else {
                const texto = await resp.text();
                mostrarMensaje(texto || 'No se pudo crear el rol.', true);
            }
        }

        function mostrarMensaje(texto, esError) {
            const el = document.getElementById('mensajeEstado');
            el.textContent = texto;
            el.className = 'mb-4 px-4 py-2 rounded-lg text-sm ' +
                (esError ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-600');
            setTimeout(() => { el.className = 'hidden mb-4 px-4 py-2 rounded-lg text-sm'; }, 4000);
        }

        function confirmarCerrarSesion(event) {
            return confirm('¿Seguro que quieres cerrar sesión?');
        }

        document.addEventListener('DOMContentLoaded', cargarMatriz);
    </script>
</body>
</html>
