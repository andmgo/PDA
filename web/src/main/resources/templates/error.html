<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Aurum Condominios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/error.css}" rel="stylesheet" />
</head>
<body>
    <div class="error-container">
        <div class="error-header">
            <div class="logo-container">
                <div class="error-code" th:text="${codigo} ?: '500'">500</div>
                <img th:src="@{/img/apple-icon.png}" alt="Aurum Condominios Logo" onerror="this.style.display='none'">
                <h1>Aurum Condominios</h1>
            </div>
        </div>

        <div class="error-body">
            <h2 class="error-title"
                th:text="${codigo == 404} ? 'Página no encontrada'
                        : (${codigo == 403} ? 'Acceso denegado'
                        : 'Error inesperado')">
                Error inesperado
            </h2>

            <p class="error-message"
               th:text="${mensaje} ?: 'Ocurrió un error. Por favor intenta de nuevo.'">
                Ocurrió un error. Por favor intenta de nuevo.
            </p>

            <p class="error-ruta" th:if="${ruta}" th:text="${ruta}"></p>
            <br th:if="${ruta == null}">

            <a href="/inicio" class="btn-home">
                <i class="fas fa-home"></i> Volver al inicio
            </a>
        </div>
    </div>
</body>
</html>
