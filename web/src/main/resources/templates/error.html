<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA: instalable como aplicación (manifest + service worker, ver static/sw.js) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E2A4A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurum" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/pwa/apple-touch-180.png" />
    <script src="/js/pwa.js" defer></script>
    <title>Error - Aurum Condominios</title>
    <link rel="icon" type="image/png" sizes="96x96" th:href="@{/img/aurum-favicon.png}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link th:href="@{/css/error.css}" rel="stylesheet" />
</head>
<body>
    <div class="error-container">
        <div class="error-header">
            <div class="logo-container">
                <div class="error-code" th:text="${codigo} ?: '500'">500</div>
                <img th:src="@{/img/aurum-isotipo.png}" alt="Aurum Condominios Logo">
                <h1><img th:src="@{/img/aurum-palabra.png}" alt="Aurum" class="aurum-palabra" /><small>Condominios</small></h1>
            </div>
        </div>

        <div class="error-body">
            <h2 class="error-title"
                th:text="${codigo == 404} ? 'Página no encontrada'
                        : (${codigo == 403} ? 'Acceso denegado'
                        : 'Error inesperado')">
                Error inesperado
            </h2>

            <p class="error-message"
               th:text="${mensaje} ?: 'Ocurrió un error. Por favor intenta de nuevo.'">
                Ocurrió un error. Por favor intenta de nuevo.
            </p>

            <p class="error-ruta" th:if="${ruta}" th:text="${ruta}"></p>
            <br th:if="${ruta == null}">

            <a href="/inicio" class="btn-home">
                <i class="fas fa-home"></i> Volver al inicio
            </a>
        </div>
    </div>
</body>
</html>
