# Despliegue: API y web en Render (plan gratis, no vence) y la base de datos
# PostgreSQL en Neon (plan gratis permanente). Ver docs/DESPLIEGUE.md.
# Render → New → Blueprint → elegir este repositorio.
#
# Plan gratis de Render: los servicios se duermen tras 15 min sin uso (el
# primer acceso tarda ~1 min) y hay 750 horas gratis al mes por cuenta.
#
# En el plan gratis la web no puede llamar a la API por la red privada: usa
# su URL pública (API_BASE_URL). Si Render le asignó otra URL a la API
# (porque el nombre ya existía), corregir API_BASE_URL y APP_CORS_ALLOWED_ORIGINS.

services:
  - type: web
    name: aurum-condominios-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - api/**
        - Dockerfile
    envVars:
      # Cadena de conexión de Neon (Dashboard → Connect), la pide Render al crear
      # el Blueprint: postgresql://usuario:clave@host/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # "dev" carga los datos de demostración (usuarios de prueba). Para un
      # conjunto real: prod.
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://aurum-condominios-web.onrender.com
      # Secretos: Render los pide al crear el Blueprint (no van en el repo).
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_SECRET
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  - type: web
    name: aurum-condominios-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - web/**
        - Dockerfile.web
    envVars:
      - key: API_BASE_URL
        value: https://aurum-condominios-api.onrender.com
      - key: INTERNAL_API_KEY
        fromService:
          name: aurum-condominios-api
          type: web
          envVarKey: INTERNAL_API_KEY
